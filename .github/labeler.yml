---
# Add 'documentation' label to any changes within 'docs' folder or any subfolders
documentation:
  - changed-files:
      - any-glob-to-any-file: docs/**
# Apply area labels from the component and cross-cutting paths a PR changes.
area:core:
  - changed-files:
      - any-glob-to-any-file: ['src/litestar_events/*.py', 'src/litestar_events/contrib/**', 'tests/conftest.py', 'tests/test_*.py', 'tests/unit/**', 'tests/smoke/**']
area:docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '**/*.md', '**/*.rst']
area:ci:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/**
area:deps:
  - changed-files:
      - any-glob-to-any-file: ['pyproject.toml', 'uv.lock']
# Add 'release' label to any PR where the head branch name starts with 'release'
release:
  - head-branch: ['^release']
bug:
  - head-branch: ['^bugfix', '^bug/', '^fix/', '^hotfix']
github_actions:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/*labeler*.yml']
tests:
  - changed-files:
      - any-glob-to-any-file: tests/**
examples:
  - changed-files:
      - any-glob-to-any-file: examples/**
# Broker / transport labels (one per emitter backend)
confluent:
  - changed-files:
      - any-glob-to-any-file:
          - src/litestar_events/contrib/confluent/**
          - tests/integration/test_confluent.py
          - examples/confluent/**
